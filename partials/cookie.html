     "uppersky:consent" event — load any analytics only after that fires. -->

      </span>
      <span class="cookie__kicker">Privacy first</span>
    </div>
    <h2 class="cookie__title">Cookies — <em>cleared for takeoff?</em></h2>
    <p class="cookie__copy">We use essential cookies to run this site and, only with your OK, analytics to learn what's useful. We never sell your data.</p>

    <div class="cookie__prefs" id="cookiePrefs" hidden>
      <label class="cookie__pref">
        <span><b>Essential</b> Keeps the site working. Always on.</span>
        <input type="checkbox" checked disabled><span class="cookie__switch" aria-hidden="true"></span>
      </label>
      <label class="cookie__pref">
        <span><b>Analytics</b> Anonymous stats on what people read.</span>
        <input type="checkbox" name="analytics"><span class="cookie__switch" aria-hidden="true"></span>
      </label>
      <label class="cookie__pref">
        <span><b>Marketing</b> Measures our own campaigns.</span>
        <input type="checkbox" name="marketing"><span class="cookie__switch" aria-hidden="true"></span>
      </label>
    </div>

    <div class="cookie__actions">
      <button type="button" class="cookie__btn cookie__btn--text" data-cookie="prefs" aria-expanded="false" aria-controls="cookiePrefs">Preferences</button>
      <button type="button" class="cookie__btn cookie__btn--ghost" data-cookie="essential">Essential only</button>
      <button type="button" class="cookie__btn cookie__btn--lime" data-cookie="accept">Accept all</button>
      <button type="button" class="cookie__btn cookie__btn--lime" data-cookie="save" hidden>Save choices</button>
    </div>
  </div>
</section>
