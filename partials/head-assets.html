<script>
  // Disable browser scroll restoration BEFORE the browser repositions on reload.
  // Must run before paint, so it lives in <head> not in app.js (which runs at body end).
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  // Best-effort: jump to top early in case the browser already restored.
  window.scrollTo(0, 0);
</script>
